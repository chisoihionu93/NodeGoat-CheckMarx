name: Vorpal SAST Scan

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

jobs:
  vorpal_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Vorpal with reviewdog
        uses: checkmarx/vorpal-reviewdog-github-action@v1.0.0
        with:
          path: "."
